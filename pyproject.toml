[project]
name = "retro-board"
version = "0.1.0"
description = "Weekly Feedback & Retrospective Tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.14,<4.15",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
